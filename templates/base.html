<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PhishSim Platform{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
            <div class="h-16 flex items-center px-6 font-bold text-xl border-b border-slate-700">
                PhishSim
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" class="block px-4 py-2 rounded-md bg-slate-800 text-white">Dashboard</a>
                <a href="#" class="block px-4 py-2 rounded-md hover:bg-slate-800 transition">Campaigns</a>
                <a href="#" class="block px-4 py-2 rounded-md hover:bg-slate-800 transition">Targets</a>
                <a href="#" class="block px-4 py-2 rounded-md hover:bg-slate-800 transition">Templates</a>
            </nav>
            <div class="p-4 border-t border-slate-700 text-sm text-slate-400">
                Logged in as <br>
                <span class="text-white font-medium">{{ request.user.email }}</span>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            
            <header class="h-16 bg-white border-b flex items-center justify-between px-6">
                <h1 class="text-2xl font-semibold text-gray-800">
                    {% block header %}Dashboard{% endblock %}
                </h1>
                <div>
                    <span class="text-sm text-gray-500">Security Team Console</span>
                </div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
                {% block content %}
                {% endblock %}
            </main>
        </div>

    </div>

</body>
</html>
