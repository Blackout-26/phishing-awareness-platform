<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PhishSim Platform{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Clean, professional dark mode forms */
        input[type="text"], input[type="email"], input[type="password"], input[type="number"], textarea, select {
            background-color: #1e293b; /* slate-800 */
            color: #f8fafc; /* slate-50 */
            border: 1px solid #334155; /* slate-700 */
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #6366f1; /* indigo-500 */
            box-shadow: 0 0 0 1px #6366f1;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col hidden md:flex">
            <div class="h-16 flex items-center px-6 border-b border-slate-800">
                <span class="font-semibold text-xl tracking-tight text-white">PhishSim<span class="text-indigo-500">.</span></span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 font-mono text-sm">
                <a href="{% url 'dashboard' %}" class="block px-4 py-2 rounded-md {% if request.resolver_match.url_name == 'dashboard' %}bg-indigo-500/10 text-indigo-400{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-200{% endif %} transition">
                    Overview
                </a>

                <a href="{% url 'campaign_create' %}" class="block px-4 py-2 rounded-md {% if 'campaign' in request.resolver_match.url_name %}bg-indigo-500/10 text-indigo-400{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-200{% endif %} transition">
                    Campaigns
                </a>

                <a href="#" class="block px-4 py-2 rounded-md {% if 'target' in request.resolver_match.url_name %}bg-indigo-500/10 text-indigo-400{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-200{% endif %} transition">
                    Targets
                </a>

                <a href="{% url 'template_list' %}" class="block px-4 py-2 rounded-md {% if 'template' in request.resolver_match.url_name %}bg-indigo-500/10 text-indigo-400{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-200{% endif %} transition">
                    Email Templates
                </a>
            </nav>
            <div class="p-4 border-t border-slate-800 text-sm text-slate-500">
                {{ request.user.email }}
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            
            <header class="h-16 bg-slate-950 border-b border-slate-800 flex items-center justify-between px-6">
                <h1 class="text-lg font-medium text-slate-100">
                    {% block header %}Dashboard{% endblock %}
                </h1>
                <div class="text-sm text-slate-500 border border-slate-700 rounded px-2 py-1 bg-slate-900">
                    Admin Console
                </div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-900 p-6">
                <div class="max-w-7xl mx-auto">
                    
                    {% if messages %}
                        <div class="mb-6 space-y-2">
                            {% for message in messages %}
                                <div class="p-4 rounded-md text-sm font-medium
                                    {% if message.tags == 'success' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/50
                                    {% elif message.tags == 'error' %}bg-rose-500/10 text-rose-400 border border-rose-500/50
                                    {% else %}bg-slate-800 text-slate-300 border border-slate-700{% endif %}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}

                    {% block content %}
                    {% endblock %}
                </div>
            </main>
        </div>

    </div>

</body>
</html>
