<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PhishSim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Clean, professional dark mode forms matching base.html */
        input[type="text"], input[type="password"] {
            background-color: #1e293b; /* slate-800 */
            color: #f8fafc; /* slate-50 */
            border: 1px solid #334155; /* slate-700 */
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #6366f1; /* indigo-500 */
            box-shadow: 0 0 0 1px #6366f1;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 antialiased min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-slate-900 p-8 rounded-lg border border-slate-800 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-cyan-500 to-emerald-500"></div>

        <div class="text-center mb-8">
            <h1 class="font-semibold text-3xl tracking-tight text-white">PhishSim<span class="text-indigo-500">.</span></h1>
            <p class="text-xs font-mono text-slate-500 mt-2 uppercase tracking-widest">> AUTHENTICATION_REQUIRED</p>
        </div>

        {% if form.errors %}
            <div class="mb-6 p-4 rounded-md text-sm font-medium bg-rose-500/10 text-rose-400 border border-rose-500/50 font-mono">
                > ERROR: Invalid credentials provided. Access denied.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-mono text-slate-400 mb-1 uppercase tracking-wider">Username</label>
                {{ form.username }}
            </div>
            
            <div>
                <label class="block text-xs font-mono text-slate-400 mb-1 uppercase tracking-wider">Password</label>
                {{ form.password }}
            </div>
            
            <input type="hidden" name="next" value="{{ next }}">
            
            <div class="pt-4">
                <button type="submit" class="w-full bg-indigo-600/20 text-indigo-400 border border-indigo-500/50 px-6 py-3 rounded font-mono text-sm hover:bg-indigo-600 hover:text-white transition shadow-[0_0_15px_rgba(99,102,241,0.15)] uppercase tracking-wider">
                    Initiate_Session
                </button>
            </div>
        </form>

        <div class="mt-8 text-center border-t border-slate-800 pt-6">
            <p class="text-slate-600 font-mono text-xs">
                AUTHORIZED PERSONNEL ONLY<br>
                <span class="text-slate-700">All access attempts are logged.</span>
            </p>
        </div>
    </div>

</body>
</html>
